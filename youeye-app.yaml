apiVersion: v1
kind: app
integration: native
version: 0.5.1
surfaceSchemaVersion: 1
metadata:
  id: "notes"
  name: "Notes"
  description: "Create, organize, and share notes with Markdown support. Full-text search, folders, pinning, and public sharing."
  icon: "sticky-note"
  category: "productivity"
  website: "https://github.com/YouEye-Platform/Notes"
  tags: ["notes", "markdown", "productivity", "native"]
  defaultSubdomain: "notes"

detail:
  longDescription: |
    Notes is a full-featured note-taking app with Markdown support. Organize with folders,
    pin important notes, use full-text search, and share notes publicly with a link.
    All data stored locally on your YouEye server with SSO authentication.
  screenshots:
    - path: "assets/screenshots/1.png"
      caption: "Note editor with Markdown preview"
    - path: "assets/screenshots/2.png"
      caption: "Folder organization and search"

capabilities:
  widgets: true
  settings_panel: true

surfaces:
  - id: default-notification
    kind: notification
    placement: notification-center
    name: Notes reminder
    description: Rich Notes reminder notification body
    embedPath: /embed/notification/default
    permissions:
      - notifications:send
  - id: app-settings
    kind: settings-panel
    placement: app-settings
    name: App Settings
    description: App-owned settings panel
    embedPath: /embed/settings
    permissions: []
  - id: recent-notes
    kind: widget
    placement: dashboard
    name: Recent Notes
    description: Your most recently updated notes
    embedPath: /embed/widget/recent-notes
    permissions: []
    defaultSize:
      width: 25
      height: 28
    minSize:
      width: 18
      height: 20
    maxSize:
      width: 45
      height: 50
    refreshInterval: 300
  - id: quick-capture
    kind: widget
    placement: dashboard
    name: Quick Capture
    description: Quickly create a new note from your dashboard
    embedPath: /embed/widget/quick-capture
    permissions: []
    defaultSize:
      width: 25
      height: 12
    minSize:
      width: 18
      height: 8
    maxSize:
      width: 40
      height: 20
  - id: pinned-notes
    kind: widget
    placement: dashboard
    name: Pinned Notes
    description: Your top pinned notes at a glance
    embedPath: /embed/widget/pinned-notes
    permissions: []
    defaultSize:
      width: 22
      height: 25
    minSize:
      width: 16
      height: 18
    maxSize:
      width: 40
      height: 45
    refreshInterval: 300
  - id: note-stats
    kind: widget
    placement: dashboard
    name: Note Stats
    description: Overview of your notes collection
    embedPath: /embed/widget/note-stats
    permissions: []
    defaultSize:
      width: 18
      height: 18
    minSize:
      width: 14
      height: 14
    maxSize:
      width: 30
      height: 30
    refreshInterval: 600
  - id: notes-note-created
    kind: timeline-card
    placement: timeline
    name: Note created
    description: Note created
    embedPath: /embed/timeline/note
    permissions:
      - timeline:write
    triggers:
      - notes-note-created
  - id: notes-note-edited
    kind: timeline-card
    placement: timeline
    name: Note edited
    description: Note edited
    embedPath: /embed/timeline/note
    permissions:
      - timeline:write
    triggers:
      - notes-note-edited

wants: []
internet:
  hosts: []

database:
  mode: shared
  name: "ye_notes"
  user: "ye_notes"

containers:
  - name: main
    type: lxd
    image: debian/12
    port: 3000
    primary: true
    network: isolated
    source:
      repo: potemsla/YE-App-Notes
      nodeVersion: "22.x"
      appDir: /opt/app
    healthCheck:
      type: http
      path: /api/health
      timeout: 120000

secrets:
  - name: db_password
    file: .db_password
    generator: password
    length: 32
  - name: jwt_secret
    file: .jwt_secret
    generator: secretKey
    length: 64

backup:
  strategy: "stop-dump-export"
  volumes: []

sso:
  type: oauth2
  callback_path: /api/auth/callback
  setup:
    method: env

env_mapping:
  DATABASE_URL: "${database.url}"
  JWT_SECRET: "${secrets.jwt_secret}"
  IDENTITY_URL: "${identity.externalUrl}"
  IDENTITY_INTERNAL_URL: "${identity.internalUrl}"
  IDENTITY_CLIENT_ID: "${sso.client_id}"
  IDENTITY_CLIENT_SECRET: "${sso.client_secret}"
  APP_URL: "${app.url}"
  NOTES_EXTERNAL_URL: "${app.url}"
  YOUEYE_GATEWAY: "${integration.gateway_url}"
  YOUEYE_APP_TOKEN: "${integration.app_token}"
  YOUEYE_APP_ID: "${app.id}"
  NODE_ENV: production
  PORT: "3000"
  HOSTNAME: "0.0.0.0"

uninstall:
  dropSharedDatabase: true

update:
  strategy: replace
  preserveData: true
  preserveSecrets: true
